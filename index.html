<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0F14" />
  <meta name="description" content="Personal workout tracker — log sets, track progress, sync across devices." />
  <title>Replog — Workout Tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%97%86%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <div id="app">
    <div class="boot" aria-live="polite">
      <div class="boot-mark">◆</div>
      <div class="boot-text">Replog</div>
    </div>
  </div>
  <script>
    // EARLY error capture — runs BEFORE the module so a module-eval failure
    // (which would otherwise never reach main.js's own handler) is surfaced.
    (function () {
      function esc(s) {
        return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }
      function showErr(msg, src, line) {
        var app = document.getElementById("app");
        if (!app) return;
        app.innerHTML =
          '<div class="center-screen"><div class="login-card">' +
          '<div class="mark" style="color:var(--danger)">◆</div>' +
          '<h1>Replog hit an error</h1>' +
          '<p class="muted" style="word-break:break-word;white-space:pre-wrap">' + esc(msg) + "</p>" +
          (src ? '<p class="muted" style="font-size:12px">' + esc(src) + (line ? ":" + esc(line) : "") + "</p>" : "") +
          '<button class="btn block" onclick="location.reload()">Reload</button>' +
          "</div></div>";
      }
      window.__replogShowErr = showErr;
      window.addEventListener("error", function (e) {
        var m = (e.error && e.error.message) || e.message || "(no message)";
        showErr(m, e.filename, e.lineno);
      });
      window.addEventListener("unhandledrejection", function (e) {
        showErr((e.reason && e.reason.message) || String(e.reason), "", "");
      });
      // Deadline: if the module never sets __replogBooted, report why.
      window.__replogDeadline = setTimeout(function () {
        if (window.__replogBooted) return;
        var app = document.getElementById("app");
        if (app && app.querySelector(".boot")) {
          var sdk = window.supabase && typeof window.supabase.createClient === "function" ? "SDK loaded" : "SDK MISSING";
          showErr("App did not start within 8s (" + sdk + "). Open the browser console (F12) for details.", "", "");
        }
      }, 8000);
    })();
  </script>
  <script src="vendor/supabase-js.min.js"></script>
  <script>
    // Verify the vendored SDK actually loaded before the module tries to use it.
    if (!window.supabase || typeof window.supabase.createClient !== "function") {
      if (window.__replogShowErr) window.__replogShowErr("Supabase SDK failed to load (vendor/supabase-js.min.js).", "", "");
      throw new Error("Supabase SDK missing");
    }
  </script>
  <script type="module" src="app/main.js"></script>
</body>
</html>
